[package]
autoexamples = false
name = "xynoos-decision"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license = "GPL-3.0-only"

[dependencies]
xynoos-pressureiq = { path = "../xynoos-pressureiq" }
xynoos-linux-control = { path = "../xynoos-linux-control" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[[example]]
name = "cgroup_probe"
path = "examples/cgroup_probe.rs"

[[example]]
name = "optimization_experiment"
path = "examples/optimization_experiment.rs"

[[example]]
name = "decision_validation"
path = "examples/validation.rs"

[[example]]
name = "workload_validation"
path = "examples/workload_validation.rs"
