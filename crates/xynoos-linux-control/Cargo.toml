[package]
name = "xynoos-linux-control"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license = "GPL-3.0-only"

[dependencies]
xynoos-pressureiq = { path = "../xynoos-pressureiq" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
crc32fast = "1.4"
sha2 = { version = "0.10", default-features = false }
