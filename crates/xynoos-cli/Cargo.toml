[package]
name = "xynoos-cli"
default-run = "xynoos"
version = "0.1.0-preview.3"
edition = "2021"
license = "GPL-3.0-only"
[dependencies]
serde = { version = "1", features = ["derive"] }
xynoos-aura = { path = "../xynoos-aura" }
xynoos-hypermemory = { path = "../xynoos-hypermemory" }
xynoos-pressureiq = { path = "../xynoos-pressureiq" }
serde_json = "1"
xynoos-decision = { path = "../xynoos-decision" }

[[bin]]
name = "xynoos"
path = "src/bin/xynoos.rs"
