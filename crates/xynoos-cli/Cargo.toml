[package]
name = "xynoos-cli"
default-run = "xynoos-cli"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
[dependencies]
xynoos-hypermemory = { path = "../xynoos-hypermemory" }
xynoos-pressureiq = { path = "../xynoos-pressureiq" }
serde_json = "1"
xynoos-decision = { path = "../xynoos-decision" }
xynoos-engine = { path = "../xynoos-engine" }
xynoos-linux-control = { path = "../xynoos-linux-control" }
libc = "0.2"

xynoos-aura = { path = "../xynoos-aura" }
serde = { version = "1", features = ["derive"] }
