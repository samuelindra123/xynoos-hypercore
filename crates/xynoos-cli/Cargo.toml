[package]
name = "xynoos-cli"
default-run = "xynoos"
version = "0.1.0-preview.3"
edition = "2021"
rust-version.workspace = true
license = "GPL-3.0-only"
[features]
# Distribution builds use dpkg/APT and emit diagnostics only to stdout.
debian-package = []
[dependencies]
serde = { version = "1", features = ["derive"] }
xynoos-aura = { path = "../xynoos-aura" }
xynoos-core = { path = "../xynoos-core" }
xynoos-hypermemory = { path = "../xynoos-hypermemory" }
xynoos-pressureiq = { path = "../xynoos-pressureiq" }
xynoos-linux-control = { path = "../xynoos-linux-control" }
serde_json = "1"
libc = "0.2"
xynoos-decision = { path = "../xynoos-decision" }

[[bin]]
name = "xynoos"
path = "src/bin/xynoos.rs"
