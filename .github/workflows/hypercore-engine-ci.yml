name: HyperCore Engine CI
on:
  push:
    branches: [main, "feat/*", "fix/*", "task/*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality & Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rustfmt Check
        run: cargo fmt --all -- --check
      - name: Workspace Check
        run: cargo check --workspace --all-targets --locked
      - name: Strict Clippy Check
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Unit, Integration & Property Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Workspace
        run: cargo test --workspace --all-targets --locked
      - name: Test HyperMemory Release Mode (Exhaustive Randomized Invariants)
        run: cargo test -p xynoos-hypermemory --release --locked

  benchmark:
    name: Memory Engine & Workload Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Release
        run: cargo build --workspace --release --locked
      - name: Run Lifecycle Benchmark
        run: |
          mkdir -p benchmark-results
          target/release/xynoos-bench lifecycle > benchmark-results/lifecycle.csv
          cat benchmark-results/lifecycle.csv
      - name: Run Mixed Cache Workload Benchmark
        run: |
          target/release/xynoos-bench mixed > benchmark-results/mixed.csv
          cat benchmark-results/mixed.csv
      - name: Run Eviction Scalability Benchmark
        run: |
          target/release/xynoos-bench scalability > benchmark-results/scalability.csv
          cat benchmark-results/scalability.csv
      - name: Run Memory Policy Comparison Benchmark
        run: |
          target/release/xynoos-bench policy-comparison > benchmark-results/policy-comparison.csv
          cat benchmark-results/policy-comparison.csv
      - name: Run Multi-Page Clustering Benchmark
        run: |
          target/release/xynoos-bench clustering > benchmark-results/clustering.csv
          cat benchmark-results/clustering.csv
      - name: Run Kernel-Tiering Interplay Benchmark
        run: |
          target/release/xynoos-bench interplay > benchmark-results/interplay.csv
          cat benchmark-results/interplay.csv
      - name: Run Continuous Daemon Benchmark
        run: |
          target/release/xynoos-bench daemon > benchmark-results/daemon.csv
          cat benchmark-results/daemon.csv
      - name: Run Shadow Workload Replay Benchmark
        run: |
          target/release/xynoos-bench shadow > benchmark-results/shadow.csv
          cat benchmark-results/shadow.csv
      - name: Run Milestone G Adaptive Compression Campaign
        run: |
          target/release/xynoos-bench adaptive-campaign > benchmark-results/adaptive-campaign.csv
          cat benchmark-results/adaptive-campaign.csv
      - name: Run Milestone G Clustering Evaluation (1/2/4/8)
        run: |
          target/release/xynoos-bench clustering-g > benchmark-results/clustering-g.csv
          cat benchmark-results/clustering-g.csv
      - name: Run Milestone G Constrained Workload Evaluation
        run: |
          target/release/xynoos-bench workload-eval > benchmark-results/workload-eval.csv
          cat benchmark-results/workload-eval.csv
      - name: Run Milestone G Sustained Daemon Benchmark (2000 cycles)
        run: |
          target/release/xynoos-bench daemon-sustained 2000 > benchmark-results/daemon-sustained.csv
          cat benchmark-results/daemon-sustained.csv
      - name: Run Candidate F HyperMemory Application Benchmark
        run: |
          target/release/xynoos-bench hypermemory-app-bench 5 > benchmark-results/candidate-f-app.csv
          cat benchmark-results/candidate-f-app.csv
      - name: Independent Reference C liblz4 Interoperability & Fuzz Verification
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends liblz4-1
          python3 scripts/lz4_interop_test.py target/release/xynoos-bench | tee benchmark-results/lz4-interop.json
      - name: Init System, Service Unit & HIL Dry-Run Compatibility Check
        run: |
          bash -n contrib/sysvinit/xynoos-hypercore.init
          bash scripts/hil-validate.sh --dry-run benchmark-results/hil-dry
          if command -v systemd-analyze >/dev/null 2>&1; then
            systemd-analyze verify systemd/xynoos-hypercore.service || true
          fi
      - name: Real Daemon CLI Resource & Signal Test (ObserveOnly)
        run: |
          set -euo pipefail
          TMPDIR_D=$(mktemp -d)
          PID_FILE="$TMPDIR_D/daemon.pid"
          t_start=$(date +%s%N)
          target/release/xynoos daemon --mode observe-only --interval-ms 200 --pid-file "$PID_FILE" > "$TMPDIR_D/out.json" &
          DPID=$!
          sleep 1
          if kill -0 "$DPID" 2>/dev/null; then
            RSS_KB=$(awk '/VmRSS:/ {print $2}' /proc/$DPID/status || echo 0)
            PSS_KB=$(awk '/Pss:/ {print $2}' /proc/$DPID/smaps_rollup || echo 0)
            FDS=$(ls /proc/$DPID/fd | wc -l || echo 0)
            echo "daemon_live_rss_kib=$RSS_KB daemon_live_pss_kib=$PSS_KB daemon_fds=$FDS"
            kill -KILL "$DPID"
            wait "$DPID" || true
          fi
          # Verify PidLock recovers cleanly after ungraceful SIGKILL leaving stale PID file
          target/release/xynoos daemon --mode observe-only --interval-ms 100 --max-cycles 2 --pid-file "$PID_FILE" > "$TMPDIR_D/recover.json"
          cat "$TMPDIR_D/recover.json"
          t_end=$(date +%s%N)
          echo "daemon_signal_test_elapsed_ms=$(( (t_end - t_start) / 1000000 ))"
          rm -rf "$TMPDIR_D"
      - name: Archive Benchmark Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hypercore-benchmark-results
          path: benchmark-results/
          retention-days: 7

  cgroup_v2_probe:
    name: Isolated Cgroup v2 Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Probe and Run Isolated Delegated Cgroup v2 Tests
        run: |
          set -euo pipefail
          echo "=== Cgroup v2 Environment Probe ==="
          stat -fc %T /sys/fs/cgroup || true
          cat /proc/self/cgroup || true
          USER_CG_REL=$(awk -F: '$1 == "0" {print $3}' /proc/self/cgroup | head -n1 || true)
          CANDIDATE="/sys/fs/cgroup${USER_CG_REL}"
          echo "Detected cgroup path: $CANDIDATE"
          if [ -d "$CANDIDATE" ] && [ -w "$CANDIDATE" ] && [ -f "$CANDIDATE/cgroup.subtree_control" ] && grep -qw memory "$CANDIDATE/cgroup.subtree_control"; then
            echo "STATUS: DELEGATED_MEMORY_CONTROLLER_AVAILABLE"
            XYNOOS_KERNEL_TEST=1 XYNOOS_CGROUP_PARENT="$CANDIDATE" \
              cargo test -p xynoos-linux-control --test kernel_transaction --locked -- --ignored --nocapture
          elif command -v systemd-run >/dev/null 2>&1 && systemctl --user status >/dev/null 2>&1; then
            echo "Attempting isolated systemd-run --user delegated scope..."
            systemd-run --user --scope -p Delegate=yes -p MemoryAccounting=yes bash -c '
              REL=$(awk -F: "\$1 == \"0\" {print \$3}" /proc/self/cgroup | head -n1)
              PARENT="/sys/fs/cgroup${REL}"
              echo "Scope cgroup: $PARENT"
              echo "Available controllers: $(cat "$PARENT/cgroup.controllers" 2>/dev/null || echo none)"
              if grep -qw memory "$PARENT/cgroup.controllers" 2>/dev/null && [ -w "$PARENT" ]; then
                mkdir -p "$PARENT/runner-leaf" "$PARENT/test-parent"
                # Respect cgroup v2 no-internal-processes rule before writing subtree_control
                for p in $(cat "$PARENT/cgroup.procs"); do echo "$p" > "$PARENT/runner-leaf/cgroup.procs" 2>/dev/null || true; done
                echo "+memory" > "$PARENT/cgroup.subtree_control" 2>/dev/null || true
                echo "+memory" > "$PARENT/test-parent/cgroup.subtree_control" 2>/dev/null || true
                if grep -qw memory "$PARENT/test-parent/cgroup.subtree_control" 2>/dev/null; then
                  echo "STATUS: DELEGATED_MEMORY_CONTROLLER_AVAILABLE_VIA_SYSTEMD_USER"
                  XYNOOS_KERNEL_TEST=1 XYNOOS_CGROUP_PARENT="$PARENT/test-parent" \
                    cargo test -p xynoos-linux-control --test kernel_transaction --locked -- --ignored --nocapture
                else
                  echo "STATUS: NOT_RUN_OR_BLOCKED (failed to enable +memory in test-parent subtree_control)"
                fi
              else
                echo "STATUS: NOT_RUN_OR_BLOCKED (memory controller not delegated to user scope)"
              fi
            ' || echo "STATUS: NOT_RUN_OR_BLOCKED (systemd-run --user unavailable)"
          else
            echo "STATUS: NOT_RUN_OR_BLOCKED (runner lacks delegated writable memory controller)"
          fi
