name: Xynoos Studio Pages
on:
  pull_request:
    branches: [main]
    paths: ['website/**', '.github/website-checks/**', '.github/workflows/studio-pages.yml']
  push:
    branches: [main]
    paths: ['website/**', '.github/website-checks/**', '.github/workflows/studio-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: studio-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: .github/website-checks/package-lock.json
      - run: npm ci --prefix .github/website-checks
      - run: npm test --prefix .github/website-checks
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD
      - name: Upload static website
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: website
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy Studio
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
