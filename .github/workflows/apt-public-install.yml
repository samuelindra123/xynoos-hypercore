name: Verify public Debian APT installation
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Expected public APT candidate version'
        required: true
        type: string
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify public archive and install in clean Debian 13 amd64
        env:
          XYNOOS_APT_FINGERPRINT: ${{ vars.XYNOOS_APT_FINGERPRINT }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 repository/public-check.py --require-apt --apt-only
          docker run --rm --platform linux/amd64 \
            -e XYNOOS_APT_FINGERPRINT -e VERSION -v "$PWD:/work:ro" \
            debian:trixie-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2 \
            bash /work/repository/public-install.sh
