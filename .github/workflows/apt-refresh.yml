name: Renew signed preview metadata
on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xynoos-apt-publication
  cancel-in-progress: false
jobs:
  renew:
    if: github.ref == 'refs/heads/main' && vars.XYNOOS_APT_FINGERPRINT != ''
    runs-on: ubuntu-24.04
    environment: apt-preview
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Renew only existing signed metadata, retain all packages
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          XYNOOS_APT_PRIVATE_KEY: ${{ secrets.XYNOOS_APT_PRIVATE_KEY }}
          XYNOOS_APT_PASSPHRASE: ${{ secrets.XYNOOS_APT_PASSPHRASE }}
          XYNOOS_APT_FINGERPRINT: ${{ vars.XYNOOS_APT_FINGERPRINT }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apt-utils gnupg
          source repository/signing.sh
          bash repository/state.sh fetch "$RUNNER_TEMP/history"
          test -f "$RUNNER_TEMP/history/apt/dists/preview/InRelease"
          python3 repository/archive.py publish "$RUNNER_TEMP/history/apt" --renew-expired
          python3 repository/apt-client.py "$RUNNER_TEMP/history/apt" --fingerprint "$XYNOOS_APT_FINGERPRINT"
          bash repository/state.sh push "$RUNNER_TEMP/history"
  pages:
    needs: renew
    uses: ./.github/workflows/studio-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
