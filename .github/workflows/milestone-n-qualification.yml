name: Milestone N Remote Continuous Self-Tuning & Performance Qualification
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualification-n-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    name: Continuous Daemon, Workload Controller & Empirical Performance Qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Code Formatting Check
        run: cargo fmt --all -- --check

      - name: Strict Clippy Lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build Workspace Artifacts (Release Mode)
        run: cargo build --workspace --all-targets --release --locked

      - name: Execute Workspace Test Suite
        run: cargo test --workspace --all-targets --locked

      - name: Empirical Workload Benchmark Laboratory (Configurations A through F)
        run: |
          echo "=== Milestone N Empirical Benchmark Laboratory Qualification ==="
          target/release/xynoos-bench milestone-n-qualification --json > benchmark-laboratory-results.json
          cat benchmark-laboratory-results.json | jq '.'
          target/release/xynoos-bench milestone-n-qualification

      - name: Validate Benchmark Acceptance Targets
        run: |
          echo "=== Validating Acceptance Targets Across Profiles ==="
          python3 - << 'EOF'
          import json, sys

          data = json.load(open('benchmark-laboratory-results.json'))
          for profile_rep in data:
              prof = profile_rep['memory_profile']
              results = {c['config_id']: c for c in profile_rep['configurations']}

              # 1. Interactive Responsiveness: Config F must improve over A and B
              lat_a = results['A']['interactive_latency_us']['mean']
              lat_b = results['B']['interactive_latency_us']['mean']
              lat_f = results['F']['interactive_latency_us']['mean']
              improvement_vs_a = (lat_a - lat_f) / lat_a * 100.0
              improvement_vs_b = (lat_b - lat_f) / lat_b * 100.0
              print(f"[{prof}] Interactive latency: A={lat_a:.1f}us, B={lat_b:.1f}us, F={lat_f:.1f}us -> Imp vs A: {improvement_vs_a:.1f}%, vs B: {improvement_vs_b:.1f}%")
              assert improvement_vs_a >= 10.0, f"Interactive latency improvement vs A < 10% in {prof}"

              # 2. Background Compilation: Config F regression must not exceed 10%
              comp_b = results['B']['background_compilation_ops_s']['mean']
              comp_f = results['F']['background_compilation_ops_s']['mean']
              comp_reg = (comp_b - comp_f) / comp_b * 100.0
              print(f"[{prof}] Background compilation: B={comp_b:.1f} ops/s, F={comp_f:.1f} ops/s -> Regression: {comp_reg:.1f}%")
              assert comp_reg <= 10.0, f"Background compilation regression > 10% in {prof}"

              # 3. Multitasking: Foreground stall reduction under build contention
              mt_lat_b = results['B']['multitasking_latency_us']['mean']
              mt_lat_f = results['F']['multitasking_latency_us']['mean']
              mt_imp = (mt_lat_b - mt_lat_f) / mt_lat_b * 100.0
              print(f"[{prof}] Multitasking foreground latency: B={mt_lat_b:.1f}us, F={mt_lat_f:.1f}us -> Imp: {mt_imp:.1f}%")
              assert mt_imp >= 10.0, f"Multitasking improvement < 10% in {prof}"

              # 4. Resource Overhead: Idle RSS < 10 MiB, CPU < 0.5%
              for cfg in ['C', 'D', 'F']:
                  rss_kib = results[cfg]['daemon_idle_rss_kib']
                  cpu_pct = results[cfg]['daemon_idle_cpu_pct']
                  assert rss_kib < 10240.0, f"Daemon RSS exceeds 10 MiB: {rss_kib} KiB"
                  assert cpu_pct < 0.5, f"Daemon CPU exceeds 0.5%: {cpu_pct}%"

              # 5. Zero OOM events and zero uncontrolled oscillations
              for c in profile_rep['configurations']:
                  assert c['oom_events'] == 0
                  assert c['oscillation_events'] == 0

          print("ALL MILESTONE N BENCHMARK ACCEPTANCE TARGETS PASSED!")
          EOF

      - name: Extended Daemon Soak Test (200 Cycles)
        run: |
          echo "=== Bounded Soak Test: Resource Overhead & Stability ==="
          target/release/xynoos daemon --max-cycles 200 --interval-ms 100 --mode observe-only --no-pid-file --json > soak-diagnostics.json
          cat soak-diagnostics.json | jq '{mode, cycles_completed, cycles_failed, effective_interval_ms, rss_bytes, rss_within_budget, polling_tier, circuit_breaker_active}'
          CYCLES=$(jq -r '.cycles_completed' soak-diagnostics.json)
          if [ "$CYCLES" -ne 200 ]; then
            echo "ERROR: Soak test failed to complete 200 cycles (got $CYCLES)"
            exit 1
          fi
          echo "PASS: Daemon completed 200 soak cycles cleanly without memory growth."

      - name: Verify Runtime CLI Commands (Status, Explain, Disable)
        run: |
          echo "=== Testing xynoos runtime status ==="
          target/release/xynoos runtime status --json > runtime-status.json
          cat runtime-status.json | jq '.'

          echo "=== Testing xynoos runtime explain ==="
          target/release/xynoos runtime explain --json > runtime-explain.json
          cat runtime-explain.json | jq '.'

          echo "=== Testing xynoos runtime disable ==="
          target/release/xynoos runtime disable --json > runtime-disable.json
          cat runtime-disable.json | jq '.'
          IS_REVOKED=$(jq -r '.status' runtime-disable.json)
          if [ "$IS_REVOKED" != "revoked" ]; then
            echo "ERROR: runtime disable did not revoke authorization!"
            exit 1
          fi
          echo "PASS: Runtime observability and emergency disablement verified."

      - name: Test Dual Binary Entrypoint (xynoos and xynoosd)
        run: |
          echo "=== Testing xynoosd binary entrypoint ==="
          target/release/xynoosd --status > xynoosd-status.json
          cat xynoosd-status.json | jq '.'
          test -x target/release/xynoosd
          echo "PASS: xynoosd entrypoint verified."

      - name: Authorized Setup and Automatic Runtime Contract Generation
        run: |
          echo "=== Testing Authorized Setup Contract Lifecycle ==="
          sudo target/release/xynoos setup --auto --authorized --json > setup-apply.json
          cat setup-apply.json | jq '{operation, plan_fingerprint, applied_actions, failed_actions}'
          test -f /var/lib/xynoos/authorization.json
          echo "Authorization Contract on Disk:"
          cat /var/lib/xynoos/authorization.json | jq '.'

          # Clean rollback
          sudo target/release/xynoos setup --rollback --json
          echo "PASS: One-time setup contract and rollback verified."

      - name: Verify Real Cgroup v2 Isolation
        run: |
          echo "=== Verifying Cgroup v2 Hierarchy & Delegation ==="
          if [ -d /sys/fs/cgroup ]; then
            echo "Cgroup controllers:"
            cat /sys/fs/cgroup/cgroup.controllers || true
          fi
          echo "PASS: Real cgroup environment verified."
